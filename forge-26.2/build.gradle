plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

base.archivesName = "${mod_id}-forge-mc${minecraft_version}"
version = mod_version
group = mod_group

// Mojang ships Java 25 to end users in 26.1+, so the mod targets Java 25.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

// Shared code lives in ../common and is compiled into this loader layer and the combined jar.
sourceSets {
    main {
        java.srcDir '../version-26.2/src/main/java'
        java.srcDir '../common/src/main/java'
        if (project.hasProperty('devTools')) { java.srcDir '../common/src/dev/java'; java.srcDir '../version-26.2/src/dev/java' }  // dev tools (self test, tour), never in releases
        resources.srcDir '../version-26.2/src/main/resources'
        resources.srcDir '../common/src/main/resources'
    }
}

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
}

// Fills in mods.toml from gradle.properties, the same way the other layers fill in their metadata.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, forge_version: forge_version,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// Unit tests for the shared logic in ../common. They need no running game.
sourceSets.test.java.srcDir '../common/src/test/java'
repositories { mavenCentral() }
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.11.0"
    testImplementation "org.mozilla:rhino:1.7.15"
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
