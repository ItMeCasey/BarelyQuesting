plugins {
    id 'idea'
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-mc${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// NeoForge 1.20.1 keeps the Forge 1.20.1 packages, so it compiles the Forge loader layer too; shared code comes from ../common.
sourceSets {
    main {
        java.srcDir '../version-1.20.1/src/main/java'
        java.srcDir '../forge-1.20.1/src/main/java'
        java.srcDir '../common/src/main/java'
        if (project.hasProperty('devTools')) { java.srcDir '../common/src/dev/java'; java.srcDir '../version-1.20.1/src/dev/java' }  // dev tools (self test, tour), never in releases
        resources.srcDir '../forge-1.20.1/src/main/resources'
        resources.srcDir '../common/src/main/resources'
    }
}

legacyForge {
    // NeoForge's 1.20.1 fork of Forge 47 keeps the net.minecraftforge packages.
    enable {
        neoForgeVersion = project.minecraft_version + '-' + project.neo_version
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            gameDirectory = layout.projectDirectory.dir('run')
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The Forge 1.20.1 mods.toml works for NeoForge 1.20.1 as well: it names the forge dependency, which NeoForge keeps.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version, forge_version: neo_version,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
        mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from '../forge-1.20.1/src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

// Unit tests for the shared logic in ../common. They need no running game.
sourceSets.test.java.srcDir '../common/src/test/java'
repositories { mavenCentral() }
dependencies {
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.11.0"
    testImplementation "org.mozilla:rhino:1.7.15"
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
