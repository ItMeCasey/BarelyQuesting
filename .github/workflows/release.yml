name: release

# Push a tag such as v2026.11.1 to build the modules whose own mod_version equals the tag (the plan job picks them; the others are not built), collect their jars (one per loader and Minecraft version),
# publish a GitHub prerelease and upload to CurseForge. The tag must equal the mod_version of the builds that are published. A manual run only builds and attaches the jars to the run, unless "publish" is ticked.
# Needs the repository secret CURSEFORGE_TOKEN (a CurseForge upload API token). Modrinth is deliberately not part of this.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release type
        type: choice
        options: [beta, alpha, release]
        default: beta
      publish:
        description: Upload to CurseForge (off builds and attaches the jars to the run only)
        type: boolean
        default: false
      dry_run:
        description: Check the CurseForge game version ids and print the upload plan, uploading nothing
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    # The layers whose own mod_version equals the tag. A layer left at an older version is neither built nor uploaded.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v5
      - id: plan
        run: python3 .github/scripts/plan_matrix.py release --tag "${GITHUB_REF_NAME}"
  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      IMC_MAVEN_USER: ${{ secrets.IMC_MAVEN_USER }}
      IMC_MAVEN_PASSWORD: ${{ secrets.IMC_MAVEN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: chmod +x ${{ matrix.layer }}/gradlew
      - name: Build and unit tests
        working-directory: ${{ matrix.layer }}
        run: ./gradlew build --no-daemon
      - name: Headless self test
        run: python3 scripts/server_check.py ${{ matrix.layer }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.layer }}
          path: |
            ${{ matrix.layer }}/build/libs/*.jar
            !${{ matrix.layer }}/build/libs/*-sources.jar
            !${{ matrix.layer }}/build/libs/*-dev.jar
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: layers

      - name: Check the version
        id: version
        # A tag publishes only the builds whose mod_version equals the tag; a module left at an older version is skipped
        # (and named in the log) instead of going out under a newer number. A manual run uses the newest mod_version of any module (the same one the plan job builds).
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(grep -h '^mod_version=' forge-*/gradle.properties neoforge-*/gradle.properties | sed 's/^mod_version=//' | sort -V | tail -n 1)
          fi
          matching=0
          for mc in 1.20.1 1.21.1 26.1.2 26.2 26.3; do
            f=$(grep -h '^mod_version=' forge-$mc/gradle.properties | sed 's/^mod_version=//')
            n=$(grep -h '^mod_version=' neoforge-$mc/gradle.properties | sed 's/^mod_version=//')
            if [ "$f" = "$version" ] && [ "$n" = "$version" ]; then matching=$((matching+1)); else echo "Minecraft $mc is at forge=$f neoforge=$n, not $version: it will not be published"; fi
          done
          if [ "$matching" -eq 0 ]; then echo "No Minecraft version has both modules at $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          mkdir -p dist
          version="${{ steps.version.outputs.version }}"
          for mc in 1.20.1 1.21.1 26.1.2 26.2 26.3; do
            for loader in forge neoforge; do
              jar="layers/$loader-$mc/barelyquesting-$loader-mc$mc-$version.jar"
              if [ -f "$jar" ]; then cp "$jar" dist/; else echo "skipping $loader $mc: no jar at version $version"; fi
            done
          done
          ls -la dist
          for jar in dist/*.jar; do
            if unzip -l "$jar" | grep -E "/dev/|SelfTest|dev/Tour|dev/SelfTest"; then echo "dev files in $jar"; exit 1; fi
          done

      - name: Write the release notes
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          {
            echo "An in-game quest book with a node graph and a list view, teams, themes, an editor and ModJS and KubeJS scripting. One jar per loader and Minecraft version (1.20.1, 1.21.1, 26.1.2, 26.2, 26.3 on Forge and NeoForge)."
            echo
            echo "Changes:"
            if [ -n "$previous" ]; then git log --no-merges --pretty='format:- %s' "$previous..${GITHUB_SHA}"; else git log --no-merges -n 20 --pretty='format:- %s'; fi
            echo
          } > notes.md
          cat notes.md

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.jar \
            --title "Barely Questing ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --prerelease

      - name: CurseForge dry run (reads the live game version list, uploads nothing)
        if: inputs.dry_run
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 .github/scripts/publish_curseforge.py \
            --jars dist \
            --version "${{ steps.version.outputs.version }}" \
            --changelog-file notes.md \
            --release-type "${{ inputs.release_type || 'beta' }}" \
            --dry-run

      - name: Upload to CurseForge
        if: (github.ref_type == 'tag' || inputs.publish) && !inputs.dry_run
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          python3 .github/scripts/publish_curseforge.py \
            --jars dist \
            --version "${{ steps.version.outputs.version }}" \
            --changelog-file notes.md \
            --release-type "${{ inputs.release_type || 'beta' }}"

      - name: Keep the jars with the run
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-jars
          path: dist/*.jar
